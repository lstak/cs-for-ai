name: Check site

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consistency checks (modules, links, downloads)
        run: python3 tools/check.py
      - name: JavaScript syntax
        run: for f in assets/*.js; do node --check "$f"; done
